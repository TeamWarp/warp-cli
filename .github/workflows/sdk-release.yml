name: CLI SDK Release

on:
  # Manual re-publish only: the automated publish for each release runs as the `publish` job
  # inside release-please.yml, in the same run that cuts the tag (dispatching a workflow here
  # instead would resolve it on the repository's default branch only, which breaks releasing
  # from any other release line). Dispatch this workflow at an existing release tag to re-run
  # a failed or skipped publish. A dispatched run is top-level, so OIDC trusted-publisher
  # claims name this file; register it as an additional trusted publisher only when manual
  # re-publishes are used. Never add a workflow_call trigger here — registries reject
  # publishes from called (reusable) workflows.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSIONING_POLICY: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs before any npm publish, the compile, and the archive upload. The tap token is otherwise
      # first used by "Update Homebrew tap", the job's last step, where a missing, expired, or revoked
      # token would fail the release after npm and the GitHub Release assets had already shipped,
      # leaving `brew install` on the previous version until the job was re-run. The tag and the
      # GitHub Release already exist either way, so a failure here still leaves a release to publish
      # again once the secret is fixed, but nothing has shipped that the second attempt has to
      # reconcile. The errors below say to re-run this job alone: in release-please.yml, re-running
      # the release-please job too (a whole-run re-run, or "failed jobs" when its back-sync also
      # failed) finds the release PR already tagged, reports no release created, and skips this job,
      # so the run goes green with the release still empty. A single-job re-run keeps its outputs.
      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::Homebrew publishing is enabled but the HOMEBREW_TAP_TOKEN (or HOMEBREW_TAP_GITHUB_TOKEN) secret is empty. Store a GitHub token with Contents: read and write on TeamWarp/homebrew-tap in it." >&2
            exit 1
          fi

          # Asks for the advertisement `git push` opens with. A clone or `git ls-remote` cannot stand
          # in for it: git sends the token only once the server asks for credentials, and GitHub never
          # asks to read a public tap, so an expired token reads one without complaint. The push side
          # always authenticates, and curl sends the token up front, so this answers 401 for a token
          # GitHub no longer accepts and 403 for one that cannot write to the tap. The token goes in
          # on stdin rather than as an argument, so it never appears in the process list.
          #
          # `--location` follows the redirect GitHub answers a renamed or transferred tap with, as git
          # does; curl keeps the credentials because the redirect stays on github.com. A transport
          # failure (DNS, TLS, timeout) makes curl exit non-zero after writing `000`, which `|| true`
          # keeps from ending the step before it can say what it was checking.
          STATUS="$(printf 'user = "x-access-token:%s"\n' "$HOMEBREW_TAP_TOKEN" \
            | curl --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 60 --config - \
              --output /dev/null --write-out '%{http_code}' \
              "https://github.com/TeamWarp/homebrew-tap.git/info/refs?service=git-receive-pack")" || true
          case "$STATUS" in
            200) ;;
            000)
              echo "::error::Could not reach GitHub to check the HOMEBREW_TAP_TOKEN (or HOMEBREW_TAP_GITHUB_TOKEN) secret against TeamWarp/homebrew-tap. Once GitHub is reachable, re-run this job." >&2
              exit 1
              ;;
            401)
              echo "::error::GitHub rejected the HOMEBREW_TAP_TOKEN (or HOMEBREW_TAP_GITHUB_TOKEN) secret: the token has expired, been revoked, or is not a GitHub token. Store a new token with Contents: read and write on TeamWarp/homebrew-tap, then re-run this job." >&2
              exit 1
              ;;
            403)
              echo "::error::The HOMEBREW_TAP_TOKEN (or HOMEBREW_TAP_GITHUB_TOKEN) secret cannot push to TeamWarp/homebrew-tap. Grant the token Contents: read and write on that repository, then re-run this job." >&2
              exit 1
              ;;
            404)
              echo "::error::TeamWarp/homebrew-tap was not found with the HOMEBREW_TAP_TOKEN (or HOMEBREW_TAP_GITHUB_TOKEN) secret. Check targets.cli.publish.homebrew.tapRepo, and that the token was granted access to that repository." >&2
              exit 1
              ;;
            *)
              echo "::error::Could not check the HOMEBREW_TAP_TOKEN (or HOMEBREW_TAP_GITHUB_TOKEN) secret against TeamWarp/homebrew-tap: GitHub answered HTTP ${STATUS}. If GitHub was having trouble, re-run this job; otherwise check targets.cli.publish.homebrew.tapRepo." >&2
              exit 1
              ;;
          esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      # The version is owned by release tooling in this repository, never by the SDK generator,
      # so the asset and Homebrew steps read it from package.json at run time.
      - name: Read package version
        run: echo "PKG_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # `bun build --compile` embeds the Bun runtime and every dependency in the executable, so the
      # published artifacts run on a machine with no Node, no Bun, and no `node_modules` — unlike the
      # npm package, which stays a normal Node CLI. Bun cross-compiles every target from this one
      # Linux runner by downloading the matching runtime, so the matrix needs no extra jobs.
      #
      # The compile reads `src/bin.ts` rather than the `tsc` output in `dist/`: Bun bundles
      # TypeScript directly, and going through `dist/` would only add the emitted ESM specifier
      # rewriting as a failure mode between the source and the shipped binary.
      #
      # Each target compiles into its own `compile-out/<target>/` directory rather than straight
      # into an archive, so anything that has to touch an executable can run as a step between this
      # one and packaging — code signing, when it is configured — and the archive is always built
      # from whatever those steps left behind.
      - name: Compile standalone binaries
        run: |
          rm -rf compile-out
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            mkdir -p "compile-out/${target}"
            case "$target" in
              windows-*)
                bun build src/bin.ts --compile --minify --target="bun-${target}" --outfile "compile-out/${target}/warp.exe"
                ;;
              *)
                bun build src/bin.ts --compile --minify --target="bun-${target}" --outfile "compile-out/${target}/warp"
                ;;
            esac
          done
      # Asset names carry no version: the release tag in the download path already does, and a
      # stable file name is what makes `releases/latest/download/<name>` resolve, so install
      # instructions can point at "latest" without being rewritten every release.
      #
      # Each tarball carries the generated man pages beside the executable, so Homebrew — and anyone
      # unpacking the download — installs `man warp` too rather than only the npm package doing
      # so. Windows has no `man`, so its zip stays the executable alone.
      #
      # They are copied in here rather than at compile time so that what any signing step above saw
      # — and, when notarization is on, what was uploaded to Apple, which zips these directories
      # whole — is the executables alone.
      - name: Package release archives
        run: |
          ROOT="$PWD"
          mkdir -p release-binaries
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            case "$target" in
              windows-*)
                (cd "compile-out/${target}" && zip -q "$ROOT/release-binaries/warp-${target}.zip" "warp.exe")
                ;;
              *)
                cp -R "man" "compile-out/${target}/man"
                tar -czf "release-binaries/warp-${target}.tar.gz" -C "compile-out/${target}" "warp" "man"
                ;;
            esac
          done
          rm -rf compile-out
          # One checksum file covering every archive, so anything that downloads one can verify what it
          # fetched before running it — `upgrade` refuses to replace the executable without it. Run from
          # inside the directory so each line names the bare asset file name, which is the name the
          # download URL ends in, rather than `release-binaries/…`; the `sed` then strips the `./` that
          # globbing leaves on each name. `checksums.txt` does not end up checksumming itself: the shell
          # expands the `./*` glob before it performs the redirection that creates the file.
          (cd release-binaries && sha256sum ./* > checksums.txt && sed -i 's| \./| |' checksums.txt)
      - name: Attach binaries to the release
        run: gh release upload "v${PKG_VERSION}" release-binaries/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          # Reads back the archives the preceding asset step just uploaded. That step runs
          # `gh release upload` on the ambient GITHUB_TOKEN, which can only write releases in
          # the repository the workflow runs in, so the download must resolve against
          # `github.repository` too. Deriving it from configured productionRepo instead lets the
          # two disagree — a renamed, transferred, or forked destination repo then 404s here on
          # every release, having uploaded the archives perfectly well one step earlier.
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${PKG_VERSION}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/TeamWarp/homebrew-tap.git" tap
          mkdir -p tap/Formula
          # Each archive holds a single `bun build --compile` executable with the Bun runtime and
          # every dependency embedded, so the formula declares no `depends_on` and installs the
          # binary as-is — `brew install` no longer pulls Node in as a dependency. The archive's man
          # pages go into `man1`, and completion scripts are generated from the installed binary
          # itself, so both always match the version installed.
          #
          # The formula file is lowercase even when the command it installs is not: Homebrew resolves
          # `brew install <owner>/<tap>/<name>` to `Formula/<name>.rb`, and that lookup is case-sensitive
          # on Linux. The `bin.install` below still installs the command under its own spelling.
          PACKAGE="tap/Formula/warp.rb"
          cat > "$PACKAGE" <<'EOF'
          class Warp < Formula
            desc "Command-line interface for warp"
            homepage "https://github.com/TeamWarp/warp-cli"
            version "__VERSION__"

            on_macos do
              on_arm do
                url "__URL_DARWIN_ARM64__"
                sha256 "__SHA_DARWIN_ARM64__"
              end
              on_intel do
                url "__URL_DARWIN_X64__"
                sha256 "__SHA_DARWIN_X64__"
              end
            end

            on_linux do
              on_arm do
                url "__URL_LINUX_ARM64__"
                sha256 "__SHA_LINUX_ARM64__"
              end
              on_intel do
                url "__URL_LINUX_X64__"
                sha256 "__SHA_LINUX_X64__"
              end
            end

            def install
              bin.install "warp"
              man1.install Dir["man/*.1"]
              generate_completions_from_executable(bin/"warp", "completion")
            end

            test do
              system bin/"warp", "--help"
            end
          end
          EOF
          # Homebrew resolves one url/sha256 pair per platform at install time, but the formula is a
          # single file, so every platform the tap supports has to be pinned on every release.
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            ASSET="warp-${target}.tar.gz"
            curl -fsSL "$BASE_URL/$ASSET" -o "$ASSET"
            SHA256="$(shasum -a 256 "$ASSET" | cut -d" " -f1)"
            # `darwin-arm64` names the `__URL_DARWIN_ARM64__`/`__SHA_DARWIN_ARM64__` placeholder
            # pair, so the loop stays driven by the target list instead of a hand-written sed per
            # platform that can silently fall out of step with the formula above.
            TOKEN="$(echo "$target" | tr "a-z-" "A-Z_")"
            sed -i -e "s|__URL_${TOKEN}__|$BASE_URL/$ASSET|" -e "s|__SHA_${TOKEN}__|$SHA256|" "$PACKAGE"
          done
          sed -i -e "s|__VERSION__|$PKG_VERSION|" "$PACKAGE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/warp.rb"
          git commit -m "warp ${PKG_VERSION}" || { echo "formula unchanged, skipping"; exit 0; }
          git push
